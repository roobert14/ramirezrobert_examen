<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Biblioteca - Reservas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f1f3f6; }
    h2 { color: #1a73e8; font-weight: 400; }
    .panel { background: #fff; border-radius: .5rem; padding: 1.25rem; box-shadow: 0 .125rem .5rem rgba(0,0,0,.08); }
    thead.cabecera th { background-color: #d6e6fb; }
    .reserva-titulo { color: #1a73e8; font-weight: 600; }
    #reservas .list-group-item { background-color: #e8f4fd; border: 0; margin-bottom: .5rem; border-radius: .25rem; }
  </style>
</head>
<body>
  <div class="container py-4">
    <div class="row g-4">
      <div class="col-12 col-lg-6">
        <div class="panel">
          <h2 class="mb-3">Libros Disponibles</h2>
          <table class="table table-hover align-middle">
            <thead class="cabecera">
              <tr>
                <th>Título</th>
                <th>Autor</th>
                <th>Género</th>
                <th>Año</th>
              </tr>
            </thead>
            <tbody id="tabla-libros"></tbody>
          </table>
        </div>
      </div>

      <div class="col-12 col-lg-6">
        <div class="panel">
          <h2 class="mb-3">Reserva un Libro</h2>
          <div class="input-group mb-2">
            <select id="selector-libro" class="form-select"></select>
            <button id="btn-reservar" class="btn btn-primary" type="button">Reservar</button>
          </div>
          <div id="mensaje" class="alert alert-warning py-2 d-none">Debes seleccionar un libro antes de reservar.</div>

          <h5 class="mt-4 mb-3">Reservas</h5>
          <ul id="reservas" class="list-group list-group-flush"></ul>
        </div>
      </div>

    </div>
  </div>

    <script>
        const llibres = [
            {id: 1, titol:"1984", autor:"George Orwell", genere:"Distopia", any:1949},
            {id: 2, titol:"Orgullo y Prejuicio", autor:"Jane Austen", genere:"Romance", any:1813},
            {id: 3, titol:"Cien años de soledad", autor:"Gabriel Garcia Marquez", genere:"Realismo mágico", any:1967},
            {id: 4, titol:"El Gran Gatsby", autor:"F. Scott Fitzgerald", genere:"Tragedia", any:1925},
            {id: 5, titol:"Matar a un ruiseñor", autor:"Harper Lee", genere:"Ficción", any:1960}
        ];

        const tabla = document.querySelector("#tabla-libros");
        const selector = document.querySelector("#selector-libro");
        const listaReservas = document.querySelector("#reservas");
        const mensaje = document.querySelector("#mensaje");

        selector.innerHTML = `<option value"">Selecciona un libro</option>`;

        for (const libro of llibres) {
            tabla.innerHTML += `
                <tr>
                    <td>${libro.titol}</td>
                    <td>${libro.autor}</td>
                    <td>${libro.genere}</td>
                    <td>${libro.any}</td>
                </tr>`;

                 selector.innerHTML += `<option value="${libro.id}">${libro.titol}</option>`;
        }

        document.querySelector("#btn-reservar").onclick = () => {
            if(selector.value === ""){
                mensaje.classList.remove("d-none");
                //detener la funcion
                return;
            }

            mensaje.classList.add("d-none");

            let libro;
            for(let i=0; i<llibres.length; i++){
                if(llibres[i].id == selector.value){
                    libro = llibres[i];
                }
            }

            const fecha = new Date().toLocaleString("es-ES");
            listaReservas.innerHTML = `
                <li class = "list-group-item">
                    <span class = "reserva-titulo">${libro.titol}</span> por ${libro.autor} - Reservado el: ${fecha}
                </li> 
            ` + listaReservas.innerHTML;
        };

        // cuando se cambia la seleccion se quita el mensaje
        selector.onchange = () => mensaje.classList.add("d-none");
    </script>
</body>
</html>
